[global]
author=["jotego"]
overrule=[ {rotate=90} ]

[features]
beta=true

[parse]
sourcefile=[ "megazone.cpp" ]
main="megazone"

[buttons]
names=[
    { names="Fire" }
]

[dipsw]
delete=[{names=["Unused","Unknown"]}]

[ROM]
regions = [
    { name="maincpu" },
    { name="audiocpu", start="SND_START" },
    { name="daccpu", start="DAC_START" },
    # Pair matching object-plane ROMs. jtmzone_game post_addr then transposes
    # group[0] with ysub[2:0] during download so each SDRAM word holds 8 X pixels.
    { name="gfx1", no_offset=true, start="OBJ_START", width=16, sequence=[0,2,1,3] },
    { name="gfx2", no_offset=true, start="SCR_START" },
    { name="proms", start="JTFRAME_PROM_START", no_offset=true },
]

order = [
    "maincpu", "audiocpu", "daccpu", "gfx1", "gfx2", "proms"
]
