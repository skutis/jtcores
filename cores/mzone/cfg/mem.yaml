params:
  - { name: SND_OFFSET, value: "`SND_START >> 1" }
  - { name: DAC_OFFSET, value: "`DAC_START >> 1" }
  - { name: OBJ_OFFSET, value: "`OBJ_START >> 1" }
  - { name: SCR_OFFSET, value: "`SCR_START >> 1" }
  - { name: FIX_OFFSET, value: "`SCR_START >> 1" }

clocks:
  clk24:
    - mul: 1
      div: 4
      outputs:
        - cpu4
        - cen_nc

audio:
  rsum: 1k
  channels:
    - { name: ay0a, module: jt49, rsum: 1k, rc_en: true, rc: [
        { r: 1k, c: 0 }, { r: 1k, c: 10n }, { r: 1k, c: 220n }, { r: 1k, c: 230n }
      ] }
    - { name: ay0b, module: jt49, rsum: 1k, rc_en: true, rc: [
        { r: 1k, c: 0 }, { r: 1k, c: 10n }, { r: 1k, c: 220n }, { r: 1k, c: 230n }
      ] }
    - { name: ay0c, module: jt49, rsum: 1k, rc_en: true, rc: [
        { r: 1k, c: 0 }, { r: 1k, c: 10n }, { r: 1k, c: 220n }, { r: 1k, c: 230n }
      ] }
    - { name: dac, data_width: 8, unsigned: true, rsum: 1k }

download:
  post_addr: true

sdram:
  banks:
    -
      buses:
        -
          name: fixrom
          addr_width: 14
          data_width: 32
          offset: FIX_OFFSET
        -
          name: scrrom
          addr_width: 14
          data_width: 32
          offset: SCR_OFFSET
        -
          name: objrom
          addr_width: 15
          data_width: 16
          offset: OBJ_OFFSET
        -
          name: snd
          addr_width: 13
          data_width: 8
          offset: SND_OFFSET
        -
          name: dac
          addr_width: 12
          data_width: 8
          offset: DAC_OFFSET
        -
          name: main
          addr_width: 16
          data_width: 8

bram:
  - name: vram0
    addr_width: 10
    data_width: 8
    addr: video_scroll_ram_addr
    dual_port:
      name: main_vram0
      addr: main_vram_addr
      din: main_vram_din
      dout: main_vram0_dout
      we: main_vram0_we
      rw: true
  - name: vram1
    addr_width: 10
    data_width: 8
    addr: video_fix_ram_addr
    dual_port:
      name: main_vram1
      addr: main_vram_addr
      din: main_vram_din
      dout: main_vram1_dout
      we: main_vram1_we
      rw: true
  - name: cram0
    addr_width: 10
    data_width: 8
    addr: video_scroll_ram_addr
    dual_port:
      name: main_cram0
      addr: main_vram_addr
      din: main_vram_din
      dout: main_cram0_dout
      we: main_cram0_we
      rw: true
  - name: cram1
    addr_width: 10
    data_width: 8
    addr: video_fix_ram_addr
    dual_port:
      name: main_cram1
      addr: main_vram_addr
      din: main_vram_din
      dout: main_cram1_dout
      we: main_cram1_we
      rw: true
  - name: main_shared
    addr_width: 11
    data_width: 8
    rw: true
    dual_port:
      name: snd_shared
      rw: true
      din: snd_shared_dout
      dout: snd_shared_din
